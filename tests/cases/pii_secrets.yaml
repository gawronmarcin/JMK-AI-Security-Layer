# C-PII-OUT (TH-05) i C-SECRET-OUT (TH-04)
- id: PII-001
  title: Email/PESEL in model output are redacted (balanced)
  kind: negative
  controls: [C-PII-OUT]
  threats: [TH-05]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-Mock-Scenario: leak_pii}
        body: {model: mock-commercial, messages: [{role: user, content: "Who is the customer?"}]}
      expect:
        status: 200
        action: redact
        control_ids: [C-PII-OUT]
        response_not_contains: ["jan.kowalski@example.com", "44051401359"]
        response_contains: ["[REDACTED:email]"]

- id: PII-002
  title: PII in model output is blocked in strict profile
  kind: negative
  controls: [C-PII-OUT]
  threats: [TH-05]
  profile: strict
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-Mock-Scenario: leak_pii}
        body: {model: mock-commercial, messages: [{role: user, content: "Who is the customer?"}]}
      expect: {status: 403, action: block, response_not_contains: ["jan.kowalski@example.com"]}

- id: PII-003
  title: PII in a tool result (CRM export) is redacted
  kind: negative
  controls: [C-PII-OUT]
  threats: [TH-05]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: tool_invoke
        body: {tool: search_docs, arguments: {query: "pii customer record"}}
      expect: {status: 200, action: redact, response_not_contains: ["jan.kowalski@example.com"]}

- id: PII-004
  title: PII in permissive profile is only flagged (passes unchanged)
  kind: edge
  controls: [C-PII-OUT]
  threats: [TH-05]
  profile: permissive
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-Mock-Scenario: leak_pii}
        body: {model: mock-commercial, messages: [{role: user, content: "Who is the customer?"}]}
      expect: {status: 200, action: flag, control_ids: [C-PII-OUT], response_contains: ["jan.kowalski@example.com"]}

- id: PII-005
  title: Plain answer without PII passes untouched
  kind: positive
  controls: [C-PII-OUT]
  threats: [TH-05]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-Mock-Scenario: "fixed:Your order ships tomorrow."}
        body: {model: mock-commercial, messages: [{role: user, content: "When will my order ship?"}]}
      expect: {status: 200, action: allow, response_contains: ["ships tomorrow"]}

- id: SEC-001
  title: AWS access key in model output is redacted (balanced)
  kind: negative
  controls: [C-SECRET-OUT]
  threats: [TH-04]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-Mock-Scenario: leak_secret}
        body: {model: mock-commercial, messages: [{role: user, content: "Show me the config."}]}
      expect:
        status: 200
        action: redact
        control_ids: [C-SECRET-OUT]
        threat_ids: [TH-04]
        response_not_contains: ["AKIAIOSFODNN7EXAMPLE"]
        response_contains: ["[REDACTED:aws_access_key]"]

