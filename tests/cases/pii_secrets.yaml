- id: SEC-003
  title: Lowercase lookalike of an AWS key is not a secret
  kind: positive
  controls: [C-SECRET-OUT]
  threats: [TH-04]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-Mock-Scenario: "fixed:The product code is akiaiosfodnn7example-v2."}
        body: {model: mock-commercial, messages: [{role: user, content: "Product code?"}]}
      expect: {status: 200, action: allow}
