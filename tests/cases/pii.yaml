# C-PII-IN / C-PII-OUT cases (R2)
# Format: ARCHITECTURE.md section 11.3. All values are synthetic.
# profile != balanced uses identity `admin` because support-agent-01 pins profile: balanced.
# Prerequisites: policy entries pii_input/secrets_input, mock scenarios echo, fixed:<text>, leak_pii, leak_secret.

- id: PII-OUT-001
  title: "Email in model output is redacted (balanced), mock leak scenario"
  kind: negative
  controls: [C-PII-OUT]
  threats: [TH-05]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-AICL-Session: s-pii-out-001, X-Mock-Scenario: "leak_pii"}
        body: {model: mock-commercial, messages: [{"role": "user", "content": "Who is the customer?"}]}
      expect:
        status: 200
        action: redact
        control_ids: [C-PII-OUT]
        threat_ids: [TH-05]
        upstream_called: true
        response_contains: ["[REDACTED:email]"]
        response_not_contains: ["jan.kowalski@example.com"]

