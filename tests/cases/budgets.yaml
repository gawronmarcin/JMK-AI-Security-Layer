- id: BGT-004
  title: "Rate limit (RPM) exceeded blocks subsequent requests"
  kind: negative
  controls: [C-BUDGET]
  threats: [TH-12]
  profile: balanced
  identity: support-agent-01
  policy_overlay:
    budgets:
      support_default: {max_requests_per_minute: 2}
  steps:
    - repeat: 2
      request:
        endpoint: chat
        headers: {X-AICL-Session: s-bgt-rpm, X-Mock-Scenario: echo}
        body: {model: mock-commercial, messages: [{"role": "user", "content": "ping"}]}
      expect:
        status: 200
        action: allow
    - request:
        endpoint: chat
        headers: {X-AICL-Session: s-bgt-rpm, X-Mock-Scenario: echo}
        body: {model: mock-commercial, messages: [{"role": "user", "content": "ping over limit"}]}
      expect:
        status: 429
        action: block
        control_ids: [C-BUDGET]
        threat_ids: [TH-12]
        upstream_called: false

