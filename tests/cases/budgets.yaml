# C-BUDGET test cases (R3). Minimum §11.5: 3 neg / 3 pos / 2 edge.

- id: BGT-001
  title: "Token overuse blocks request at ingress"
  kind: negative
  controls: [C-BUDGET]
  threats: [TH-11]
  profile: balanced
  identity: support-agent-01
  policy_overlay:
    budgets:
      support_default: {max_tokens: 50}
  steps:
    - request:
        endpoint: chat
        headers: {X-AICL-Session: s-bgt-tok1, X-Mock-Scenario: "tokens:60:0"}
        body: {model: mock-commercial, messages: [{"role": "user", "content": "first message consumes tokens"}]}
      expect: {status: 200, action: allow}
    - request:
        endpoint: chat
        headers: {X-AICL-Session: s-bgt-tok1, X-Mock-Scenario: echo}
        body: {model: mock-commercial, messages: [{"role": "user", "content": "second message blocked"}]}
      expect:
        status: 429
        action: block
        control_ids: [C-BUDGET]
        threat_ids: [TH-11]

- id: BGT-002
  title: "Cost budget exceeded blocks subsequent requests"
  kind: negative
  controls: [C-BUDGET]
  threats: [TH-12]
  profile: balanced
  identity: support-agent-01
  policy_overlay:
    budgets:
      support_default: {max_cost_usd: 0.0001}
  steps:
    - request:
        endpoint: chat
        headers: {X-AICL-Session: s-bgt-cost, X-Mock-Scenario: "tokens:1000:1000"}
        body: {model: mock-commercial, messages: [{"role": "user", "content": "expensive prompt"}]}
      expect: {status: 200, action: allow}
    - request:
        endpoint: chat
        headers: {X-AICL-Session: s-bgt-cost, X-Mock-Scenario: echo}
        body: {model: mock-commercial, messages: [{"role": "user", "content": "blocked"}]}
      expect:
        status: 429
        action: block
        control_ids: [C-BUDGET]
        threat_ids: [TH-12]

- id: BGT-003
  title: "Request within normal token and cost limits passes"
  kind: positive
  controls: [C-BUDGET]
  threats: [TH-11, TH-12]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-AICL-Session: s-bgt-001, X-Mock-Scenario: "tokens:100:50"}
        body: {model: mock-commercial, messages: [{"role": "user", "content": "Short question"}]}
