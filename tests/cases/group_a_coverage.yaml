        endpoint: chat
        headers: {X-AICL-Session: s-cov-005, X-Mock-Scenario: "fixed:ok"}
        body:
          model: mock-commercial
          messages: [{"role": "user", "content": "find the VPN manual"}]
          tools: [{"type": "function", "function": {"name": "search_docs", "description": "Search the knowledge base for product manuals.", "parameters": {"type": "object", "properties": {"query": {"type": "string", "description": "Search terms"}}}}}]
      expect: {status: 200, action: allow, upstream_called: true, response_contains: ["ok"]}

