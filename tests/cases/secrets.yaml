# C-SECRET-IN / C-SECRET-OUT cases (R2)
# Format: ARCHITECTURE.md section 11.3. All values are synthetic.
# profile != balanced uses identity `admin` because support-agent-01 pins profile: balanced.
# Prerequisites: policy entries pii_input/secrets_input, mock scenarios echo, fixed:<text>, leak_pii, leak_secret.

- id: SEC-OUT-001
  title: "AWS key in output is redacted (balanced), mock leak scenario"
  kind: negative
  controls: [C-SECRET-OUT]
  threats: [TH-04]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-AICL-Session: s-sec-out-001, X-Mock-Scenario: "leak_secret"}
        body: {model: mock-commercial, messages: [{"role": "user", "content": "Show me the deploy credentials."}]}
      expect:
        status: 200
        action: redact
        control_ids: [C-SECRET-OUT]
        threat_ids: [TH-04]
        upstream_called: true
        response_contains: ["[REDACTED:aws_access_key]"]

