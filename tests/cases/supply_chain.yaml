- id: SUPPLY-003
  title: Compromised model repository evil-org/backdoored-llm is blocked
  kind: negative
  controls: [C-SUPPLY]
  threats: [TH-16]
  profile: balanced
  identity: admin
  policy_overlay:
    controls:
      model_allowlist: {enabled: false}
  steps:
    - request:
        endpoint: chat
        body: {model: "evil-org/backdoored-llm", messages: [{role: user, content: "hi"}]}
      expect: {status: 403, action: block, control_ids: [C-SUPPLY], threat_ids: [TH-16]}

