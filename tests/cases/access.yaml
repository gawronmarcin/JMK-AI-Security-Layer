# C-AUTH (TH-08), C-MODEL-ALLOW (TH-06), C-TOOL-ACL (TH-07)
- id: AUTH-001
  title: Missing API key is rejected with 401
  kind: negative
  controls: [C-AUTH]
  threats: [TH-08]
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        auth: none
        body: {model: mock-commercial, messages: [{role: user, content: "hi"}]}
      expect: {status: 401, upstream_called: false}

- id: AUTH-002
  title: Invalid API key is rejected with 401
  kind: negative
  controls: [C-AUTH]
  threats: [TH-08]
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        auth: invalid
        body: {model: mock-commercial, messages: [{role: user, content: "hi"}]}
      expect: {status: 401, upstream_called: false}

- id: AUTH-003
  title: Valid key passes
  kind: positive
  controls: [C-AUTH]
  threats: [TH-08]
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        body: {model: mock-commercial, messages: [{role: user, content: "hi"}]}
      expect: {status: 200, upstream_called: true}

- id: AUTH-004
  title: Impersonation attempt via mismatching X-AICL-Agent header is rejected
  kind: negative
  controls: [C-AUTH]
  threats: [TH-08]
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-AICL-Agent: admin}
        body: {model: mock-commercial, messages: [{role: user, content: "hi"}]}
      expect: {status: 401, upstream_called: false}

- id: AUTH-005
  title: Admin key passes authentication
  kind: positive
  controls: [C-AUTH]
  threats: [TH-08]
  identity: admin
  steps:
    - request:
        endpoint: chat
        body: {model: mock-commercial, messages: [{role: user, content: "hi"}]}
      expect: {status: 200, upstream_called: true}

- id: AUTH-006
  title: Researcher key passes authentication
  kind: positive
  controls: [C-AUTH]
  threats: [TH-08]
  identity: research-agent-01
  steps:
    - request:
        endpoint: chat
        body: {model: ollama-local, messages: [{role: user, content: "hi"}]}
      expect: {status: 200, upstream_called: true}

- id: AUTH-007
  title: Valid key on second request in session passes
  kind: edge
  controls: [C-AUTH]
  threats: [TH-08]
  identity: support-agent-01
  steps:
    - request:
        endpoint: chat
        headers: {X-AICL-Session: s-auth-edge}
        body: {model: mock-commercial, messages: [{role: user, content: "msg1"}]}
      expect: {status: 200, upstream_called: true}
    - request:
        endpoint: chat
        headers: {X-AICL-Session: s-auth-edge}
        body: {model: mock-commercial, messages: [{role: user, content: "msg2"}]}
      expect: {status: 200, upstream_called: true}

- id: AUTH-008
  title: Tool invoke endpoint authenticates caller properly
  kind: edge
  controls: [C-AUTH]
  threats: [TH-08]
  identity: support-agent-01
  steps:
    - request:
        endpoint: tool_invoke
        body: {tool: search_docs, arguments: {query: "test"}}
      expect: {status: 200, upstream_called: true}

- id: MODEL-001
  title: Researcher may not use the commercial model
  kind: negative
  controls: [C-MODEL-ALLOW]
  threats: [TH-06]
  identity: research-agent-01
  steps:
    - request:
        endpoint: chat
        body: {model: mock-commercial, messages: [{role: user, content: "hi"}]}
      expect: {status: 403, action: block, control_ids: [C-MODEL-ALLOW], upstream_called: false}

- id: MODEL-002
  title: Unknown model name is blocked
  kind: negative
  controls: [C-MODEL-ALLOW]
  threats: [TH-06]
  identity: admin
  steps:
    - request:
        endpoint: chat
        body: {model: gpt-unknown-9000, messages: [{role: user, content: "hi"}]}
      expect: {status: 403, upstream_called: false}

- id: MODEL-003
  title: Hot-reloadable allowlist — overlay grants the model
  kind: edge
  controls: [C-MODEL-ALLOW]
  threats: [TH-06]
  identity: research-agent-01
  policy_overlay:
    roles: {researcher: {models: [ollama-local, mock-commercial]}}
  steps:
    - request:
        endpoint: chat
        body: {model: mock-commercial, messages: [{role: user, content: "hi"}]}
      expect: {status: 200, upstream_called: true}

