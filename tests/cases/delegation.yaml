# C-DELEG (TH-09): Delegation and privilege escalation guard. Minimum §11.5: 3 neg / 3 pos / 2 edge.
- id: DELEG-001
  title: Delegation call exceeding max depth is blocked
  kind: negative
  controls: [C-DELEG]
  threats: [TH-09]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: tool_invoke
        body: {tool: delegate_task, arguments: {depth: 5, role: support_agent, task: "process invoice"}}
      expect: {status: 403, action: block, control_ids: [C-DELEG], threat_ids: [TH-09]}

- id: DELEG-002
  title: Privilege escalation from support_agent to admin is blocked
  kind: negative
  controls: [C-DELEG]
  threats: [TH-09]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: tool_invoke
        body: {tool: delegate_task, arguments: {depth: 1, role: admin, task: "delete audit log"}}
      expect: {status: 403, action: block, control_ids: [C-DELEG], threat_ids: [TH-09]}

- id: DELEG-003
