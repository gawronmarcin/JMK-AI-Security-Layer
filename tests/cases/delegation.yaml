- id: DELEG-004
  title: Safe delegation within depth limit and same role passes
  kind: positive
  controls: [C-DELEG]
  threats: [TH-09]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: tool_invoke
        body: {tool: delegate_task, arguments: {depth: 1, role: support_agent, task: "format customer reply"}}
      expect: {status: 200, action: allow, upstream_called: true}

