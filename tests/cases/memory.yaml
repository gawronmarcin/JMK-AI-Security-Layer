# C-MEM-ACL (TH-10): Memory / RAG namespace access control. Minimum §11.5: 3 neg / 3 pos / 2 edge.

- id: MEM-ACL-001
  title: "Support agent blocked from restricted HR memory namespace"
  kind: negative
  controls: [C-MEM-ACL]
  threats: [TH-10]
  profile: balanced
  identity: support-agent-01
  steps:
    - request:
        endpoint: tool_invoke
        body:
          tool: search_docs
          arguments: {query: "payroll report", namespace: "kb_hr"}
      expect:
        status: 403
        action: block
        control_ids: [C-MEM-ACL]
        threat_ids: [TH-10]

