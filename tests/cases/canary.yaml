- id: CANARY-008
  title: "Custom canary tokens configured in overlay are detected"
  kind: edge
  controls: [C-CANARY]
  threats: [TH-18]
  profile: balanced
  identity: support-agent-01
  policy_overlay:
    controls:
      canary:
        params:
          tokens: ["CUSTOM-CANARY-XYZ999"]
  steps:
    - request:
        endpoint: chat
        headers: {X-Mock-Scenario: "fixed:leaked CUSTOM-CANARY-XYZ999 token"}
        body: {model: mock-commercial, messages: [{"role": "user", "content": "leak"}]}
      expect:
        status: 403
        action: block
        control_ids: [C-CANARY]
        threat_ids: [TH-18]

- id: CANARY-009
  title: "Canary token inside tool call by admin role is blocked"
