# Example corpus for C-INJ-EMB (multilingual embedding similarity, docs/SEMANTIC_SETUP.md).
# Externally managed like attacks.yaml: hot-reloaded (the gateway re-embeds it in the background),
# an invalid file keeps the last good version. Bump corpus_version on every change.
#
# label: attack | benign. A text is suspicious only when it is closer to an attack than to every
# benign example (policy `margin`), so benign entries matter as much as attacks. Most are HARD
# NEGATIVES: ordinary requests sharing words with attacks ("ignore my last message", "reset the
# admin password", "explain what a system prompt is"). Add one for every false positive you see.
#
# category: what the attack does (override, prompt_exfil, persona, fiction, authority,
# refusal_suppression, data_exfil, secret_harvest, tool_abuse, indirect, delimiter,
# output_evasion, payload_split, context_reset) or hard_negative / ordinary / document for benign.
# group: translations and close variants of one example share a group; calibration
# (scripts/check_semantic.py --calibrate) leaves the whole group out, so translations do not
# make the measured recall look better than it is.
#
# Synthetic texts only. Do NOT copy the probes from scripts/check_semantic.py or the cases from
# scripts/stack_cases.yaml into this file: they are the held-out sets that measure generalization
# (tests/core/test_injection_embedding.py checks it).

corpus_version: "2026-10-04.3"
examples:
  # ============================================================================ ATTACKS
  # --- override: cancel previous instructions ---------------------------------------------
