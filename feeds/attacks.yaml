  # --- Broader injection signatures (weighted, §4.2) -------------------------------------
  # Matched against normalized text (casefolded, homoglyphs folded, zero-width removed) and
  # decoded fragments (base64/hex/url/rot13/leetspeak). severity drives the outcome through
  # each profile's min_severity:
  #   high -> blocks in strict and balanced, flags in permissive
  #   low  -> never blocks in balanced; raises ctx.risk so the semantic judge looks at it
  # Overrides need an explicit qualifier (previous/prior/above/your/all ...) right before the
  # noun and are skipped after a negation, so "don't ignore any of the safety instructions"
  # or "ignore the typos in my previous message" do not match.
  # Patterns are single-quoted: YAML leaves backslashes alone, a quote is written as ''.

  - id: SIG-INJ-006
    set: injection
    kind: regex
    pattern: '(?i)(?<!n''t )(?<!not )(?<!never )\b(ignore|disregard|forget|override|bypass|skip)\W+(?:(?:all|any|of|the|your|my|these|those|every)\W+){0,3}(?:previous|prior|above|earlier|preceding|former|original|initial|system|existing)\W+(?:\w+\W+)?(?:instructions?|rules?|prompts?|guidelines?|directives?|commands?|guardrails?|restrictions?|context)\b'
    severity: high
    description: "Instruction override with a qualifier (ignore your/all previous/prior/above instructions)"
    refs: ["OWASP LLM01:2025", "AML.T0051.000"]
    added: "2026-10-03"

  - id: SIG-INJ-007
    set: injection
    kind: regex
    pattern: '(?i)(?<!n''t )(?<!not )(?<!never )\b(ignore|disregard|forget|override|bypass)\W+(?:all\W+(?:of\W+)?)?(?:your|all|any)\W+(?:instructions?|rules?|guidelines?|directives?|guardrails?|restrictions?|safety\W+(?:rules|guidelines|filters?))\b'
    severity: high
    description: "Instruction override without qualifier (ignore your instructions, bypass all restrictions)"
    refs: ["OWASP LLM01:2025", "AML.T0051.000"]
    added: "2026-10-03"

  - id: SIG-INJ-008
    set: injection
