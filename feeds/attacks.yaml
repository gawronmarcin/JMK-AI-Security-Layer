    pattern: '(?i)\b(ignore|disregard|forget)\W+(?:everything|all|anything)\W+(?:you\W+(?:were|have\W+been)\W+(?:told|given)|(?:said|written|stated)\W+(?:above|before|earlier)|above|before|so\W+far)\b'
    severity: high
