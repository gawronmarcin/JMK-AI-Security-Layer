# AICL sample policy - one file controls everything (ARCHITECTURE.md §6).
# Hot-reloaded: save the file and the next request uses the new rules.
# An invalid file is rejected and the previous policy stays active.

version: 1
meta: {name: default-policy, description: "Sample policy, 3 strictness levels"}

active_profile: balanced        # strict | balanced | permissive (identity may override)
mode: enforce                   # enforce | shadow  (per-control `mode` overrides)
evaluation: first_block         # first_block | collect_all
on_error_default: fail_closed   # fail_closed | fail_open (per-control `on_error` overrides)

# --- Who may call the gateway ----------------------------------------------------------------
identities:
  - id: support-agent-01
    api_key_env: AICL_KEY_SUPPORT      # key is read from the environment, never stored here
    role: support_agent
    profile: balanced
  - id: research-agent-01
    api_key_env: AICL_KEY_RESEARCH
    role: researcher
    profile: strict
  - id: admin
    api_key_env: AICL_KEY_ADMIN
    role: admin

roles:
  support_agent:
    models: [mock-commercial, ollama-local]
    tools: [search_docs, send_email]
    memory_namespaces: [kb_public]
    budget: support_default
    may_delegate_to: [researcher]
  researcher:
    models: [ollama-local]
    tools: [search_docs, fetch_url]
    memory_namespaces: [kb_public, kb_research]
    budget: research_default
  admin:
    models: ["*"]
    tools: ["*"]
    memory_namespaces: ["*"]
    budget: unlimited

# --- Upstreams ---------------------------------------------------------------------------------
models:
  - name: mock-commercial          # stands in for a paid API in tests/demo; real-looking prices
    provider: openai_compatible
    base_url_env: AICL_UPSTREAM_MOCK_URL
    local: false
    price_per_1k_tokens: {input: 0.0005, output: 0.0015}
  - name: ollama-local
    provider: ollama
    base_url_env: AICL_OLLAMA_URL
    upstream_model: "llama3.2:3b"   # TEAM DECISION: pick after measuring latency
    local: true
    price_per_1k_tokens: {input: 0.0, output: 0.0}

tools:
  search_docs:
    backend_url_env: AICL_TOOL_DOCS_URL
    privilege: low                      # low | medium | high | critical
    output_trust: untrusted             # its output taints the session
    arg_schema: {type: object, required: [query], properties: {query: {type: string, maxLength: 500}}}
  fetch_url:
    backend_url_env: AICL_TOOL_FETCH_URL
    privilege: medium
    output_trust: untrusted
    arg_schema: {type: object, required: [url], properties: {url: {type: string, maxLength: 2000}}}
  send_email:
    backend_url_env: AICL_TOOL_MAIL_URL
    privilege: high
    output_trust: trusted
    arg_schema: {type: object, required: [to, subject, body]}
  run_shell:
    backend_url_env: AICL_TOOL_SHELL_URL
    privilege: critical
    output_trust: untrusted

# --- Budgets (null/omitted limit = no limit) -------------------------------------------------
budgets:
  support_default:
    window: day                         # minute | hour | day
    max_tokens: 200000
    max_cost_usd: 2.00
    max_compute_seconds: 600            # local models: wall-clock inference time
    max_requests_per_minute: 30
    max_tool_calls_per_session: 25
    max_identical_tool_calls: 3         # same tool + same normalized args within the loop window
    loop_window_seconds: 60
    max_delegation_depth: 2
    on_exceed: block                    # block | throttle | downgrade_model
  research_default:
    window: day
    max_tokens: 500000
    max_cost_usd: null
    max_compute_seconds: 1800
    max_requests_per_minute: 20
    max_tool_calls_per_session: 40
    max_identical_tool_calls: 3
    loop_window_seconds: 60
    max_delegation_depth: 1
    on_exceed: block
  unlimited: {}

# --- Controls: same envelope for every control; `levels` = action per profile -------------
controls:
  size_limits:
    id: C-SIZE
    threat_ids: [TH-20]
    enabled: true
    stages: [ingress]
    params: {max_body_bytes: 1048576, max_messages: 200, max_chars_per_message: 100000, max_artifact_bytes: 104857600}
    levels:
      strict:     {action: block}
      balanced:   {action: block}
      permissive: {action: block}

  model_allowlist:
    id: C-MODEL-ALLOW
    threat_ids: [TH-06]
    enabled: true
    stages: [ingress]
    levels:
      strict:     {action: block}
      balanced:   {action: block}
      permissive: {action: block}

  injection_patterns:
    id: C-INJ-PAT
    threat_ids: [TH-01, TH-02]
    enabled: true
    on_error: fail_closed
    stages: [input, tool_result]
    params: {signature_sets: [injection]}
    levels:
      strict:     {action: block, min_severity: low}
      balanced:   {action: block, min_severity: medium}
      permissive: {action: flag,  min_severity: high}

  # Tier 2 of the injection cascade: C-INJ-PAT (regex) -> C-INJ-BASTION (classifier) -> C-INJ-SEM (Ollama).
  # risk >= threshold_block -> action; risk in [threshold_grey, threshold_block) -> escalated to the
  # Ollama judge (keep that range inside semantic.run_when.risk_between). Setup: docs/SEMANTIC_SETUP.md
  injection_bastion:
    id: C-INJ-BASTION
    threat_ids: [TH-01, TH-02]
    enabled: true
    on_error: fail_open                 # classifier down must not take the gateway down
    stages: [input, tool_result]
    params:
      backend: none                     # none (skipped) | embedding (vector similarity) | bastion (SDK) | remote (HTTP /protect)
      url_env: AICL_BASTION_URL         # remote: e.g. http://localhost:8080 (Bastion Docker image)
      model: ""                         # bastion: HF repo id, empty = free English model
      timeout_ms: 300
      threshold_block: 0.80
      threshold_grey: 0.30
    levels:
      strict:     {action: block, threshold_block: 0.70, threshold_grey: 0.25}
      balanced:   {action: block, threshold_block: 0.80, threshold_grey: 0.30}
      permissive: {action: flag,  threshold_block: 0.90, threshold_grey: 0.40}
    
  pii_input:
    id: C-PII-IN
    threat_ids: [TH-03]
    enabled: true
    stages: [input]
    # ip_address left out on purpose: users legitimately paste IPs when asking for network help
    params: {types: [email, phone_pl, pesel, iban, credit_card]}
    levels:
      strict:     {action: block}
      balanced:   {action: redact}
      permissive: {action: flag}

  secrets_input:
    id: C-SECRET-IN
    threat_ids: [TH-04]
    enabled: true
    stages: [input]
    params: {types: [aws_access_key, api_key_generic, private_key_block, jwt, password_assignment]}
    levels:
      strict:     {action: block}
      balanced:   {action: redact}
      permissive: {action: redact}

  
  pii_output:
    id: C-PII-OUT
    threat_ids: [TH-05]
    enabled: true
    stages: [output, tool_result]
    params: {types: [email, phone_pl, pesel, iban, credit_card, ip_address]}
    levels:
      strict:     {action: block}
      balanced:   {action: redact}
      permissive: {action: flag}

  secrets_output:
    id: C-SECRET-OUT
    threat_ids: [TH-04]
    enabled: true
    stages: [output, tool_result]
    params: {types: [aws_access_key, api_key_generic, private_key_block, jwt, password_assignment]}
    levels:
      strict:     {action: block}
      balanced:   {action: redact}
      permissive: {action: redact}

  tool_acl:
    id: C-TOOL-ACL
    threat_ids: [TH-07]
    enabled: true
    stages: [tool_call]
    levels:
      strict:     {action: block, validate_args: true}
      balanced:   {action: block, validate_args: true}
      permissive: {action: flag,  validate_args: false}

  code_exec_patterns:
    id: C-CODE-EXEC
    threat_ids: [TH-15]
    enabled: true
    stages: [tool_call, output]
    params: {patterns: [shell_metachar_chain, eval_exec, curl_pipe_sh, reverse_shell]}
    levels:
      strict:     {action: block}
      balanced:   {action: block}
      permissive: {action: flag}

  artifact_scan:
    id: C-ARTIFACT
    threat_ids: [TH-14]
    enabled: true
    stages: [artifact]
    # Unsafe content (dangerous globals, bad archives, unparseable files) -> action.
    # Warnings (raw pickle, unknown globals, extension mismatch) -> flag, or action with block_on_warn.
    params: {dangerous_globals_from_feed: true, reject_unparseable: true,
             max_archive_entries: 2000, max_unpacked_bytes: 536870912}
    levels:
      strict:     {action: block, block_on_warn: true}
      balanced:   {action: block}
      permissive: {action: flag}

  injection_semantic:
    id: C-INJ-SEM
    threat_ids: [TH-01, TH-02]
    enabled: true
    stages: [input, tool_result]
    on_error: fail_open                 # judge down must not take the gateway down
    levels:
      strict:     {action: block, threshold: 0.50}
      balanced:   {action: block, threshold: 0.70}
      permissive: {action: flag,  threshold: 0.85}

  canary:
    id: C-CANARY
    threat_ids: [TH-18]
    enabled: true
    stages: [output, tool_call]
    params: {tokens_env: [AICL_CANARY_1, AICL_CANARY_2], inject_into_system_prompt: true}
    levels:
      strict:     {action: block}
      balanced:   {action: block}
      permissive: {action: block}

  loop_guard:
    id: C-LOOP
    threat_ids: [TH-13]
    enabled: true
    stages: [tool_call]
    levels:
      strict:     {action: block}
      balanced:   {action: block}
      permissive: {action: flag}

  budget_guard:
    id: C-BUDGET
    threat_ids: [TH-11, TH-12]
    enabled: true
    stages: [ingress]
    levels:
      strict:     {action: block}
      balanced:   {action: block}
      permissive: {action: flag}

  taint:
    id: C-TAINT
    threat_ids: [TH-19]
    enabled: true
    stages: [tool_call]
    levels:
      strict:     {action: block}
      balanced:   {action: block}
      permissive: {action: block}

  memory_acl:
    id: C-MEM-ACL
    threat_ids: [TH-10]
    enabled: true
    stages: [tool_call, input]
    levels:
      strict:     {action: block}
      balanced:   {action: block}
      permissive: {action: flag}

# --- Semantic judge (local Ollama) ---------------------------------------------------------
semantic:
  provider: ollama
  base_url_env: AICL_OLLAMA_URL
  model: "llama3.2:3b"
  timeout_ms: 1500
  run_when:
    untrusted_segments: true            # always judge tool output / retrieved docs / uploads
    risk_between: [0.15, 0.85]          # deterministic risk in the grey zone
    sample_rate: 0.0                    # share of remaining requests judged anyway (0..1)
  max_input_chars: 4000

taint:
  enabled: true
  blocked_privileges_when_tainted: [high, critical]
  action: block                         # block | require_approval
  session_ttl_seconds: 3600

memory:
  namespaces:
    kb_public:   {sensitivity: public}
    kb_research: {sensitivity: internal}
    kb_hr:       {sensitivity: restricted}    # no role has it -> access must be blocked (TH-10)

signature_feeds:
  - name: historical-attacks
    path: ./feeds/attacks.yaml
    refresh_seconds: 30
    on_unavailable: keep_last_good

audit:
  path: ./data/audit.jsonl
  content: masked                       # masked | none (raw content is never logged)
  replay_capture: false
  max_event_bytes: 65536
