[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicl"
version = "0.2.0"
description = "AI Control Layer: security gateway between agents and LLMs, tools and MCP servers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2.1",
    "pytest-xdist>=3.5",
]
# C-INJ-BASTION in-process backends (docs/SEMANTIC_SETUP.md):
# - protectai: ProtectAI/deberta-v3-base-prompt-injection-v2 (Apache-2.0, recommended), ONNX export
#   run with onnxruntime: no torch/transformers
# - bastion: bastion-prompt-protection (AGPL-3.0, optional on purpose)
protectai = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.20",
    "numpy>=1.24",
]
# shared state (budgets, sessions, HITL approvals) for several gateway instances: AICL_STATE_URL
redis = [
    "redis>=5",
]
bastion = [
    "bastion-prompt-protection",
]
dev = [
    "aicl[test]",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["aicl*"]

[tool.setuptools.package-data]
# Static dashboard served at /dashboard/ (aicl/dashboard/README.md).
aicl = ["dashboard/*.html", "dashboard/*.js", "dashboard/*.css", "dashboard/*.md", "dashboard/views/*.js",
        "dashboard/vendor/*", "dashboard/demo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `live` tests (real Ollama) are skipped unless --live is given (tests/conftest.py).
addopts = "-ra --strict-markers"
markers = [
    "live: needs a running Ollama (skipped by default, run with --live / make test-live)",
    "perf: performance measurement (writes reports/perf.json)",
    "gateway: needs the aicl gateway",
]
filterwarnings = ["default::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E702", "E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
