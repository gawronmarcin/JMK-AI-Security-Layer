# Threat Catalog (§7): threats TH-01..TH-20 mapped to OWASP LLM / OWASP Agentic / MITRE ATLAS.
#
# Reference editions (numbering differs between editions, do not mix them):
#   owasp_llm:     OWASP Top 10 for LLM Applications 2025 (LLM01..LLM10)
#                  https://genai.owasp.org/llm-top-10/
#   owasp_agentic: OWASP Top 10 for Agentic Applications 2026 (ASI01..ASI10, published Dec 2025)
#                  ASI01 Agent Goal Hijack, ASI02 Tool Misuse, ASI03 Identity & Privilege Abuse,
#                  ASI04 Agentic Supply Chain, ASI05 Unexpected Code Execution, ASI06 Memory & Context
#                  Poisoning, ASI07 Insecure Inter-Agent Communication, ASI08 Cascading Failures,
#                  ASI09 Human-Agent Trust Exploitation, ASI10 Rogue Agents
#   atlas:         MITRE ATLAS technique IDs, checked against atlas-data v5.6.0
#                  https://github.com/mitre-atlas/atlas-data
#
# Every mapping is a list. An empty list means no entry of that framework fits well;
# we prefer no mapping over a misleading one.

threats:
  - id: TH-01
    name: Direct Prompt Injection
    category: Prompt Injection
    description: Direct instruction override or jailbreak embedded in user input
    controls: [C-INJ-PAT, C-INJ-EMB, C-INJ-BASTION, C-INJ-SEM]
    owasp_llm: [LLM01:2025]           # Prompt Injection
    owasp_agentic: [ASI01]            # Agent Goal Hijack
    atlas: [AML.T0051.000, AML.T0054] # LLM Prompt Injection: Direct; LLM Jailbreak

  - id: TH-02
    name: Indirect Prompt Injection
    category: Prompt Injection
    description: Untrusted external data (web, retrieved doc, tool output) instructs the model
    controls: [C-INJ-PAT, C-INJ-EMB, C-INJ-BASTION, C-INJ-SEM]
    owasp_llm: [LLM01:2025]           # Prompt Injection
    owasp_agentic: [ASI01, ASI06]     # Agent Goal Hijack; Memory & Context Poisoning
    atlas: [AML.T0051.001, AML.T0070] # LLM Prompt Injection: Indirect; RAG Poisoning

  - id: TH-03
    name: Inbound PII Exposure
    category: Sensitive Data
    description: PII provided in user input
    controls: [C-PII-IN]
    owasp_llm: [LLM02:2025]           # Sensitive Information Disclosure
    owasp_agentic: []
    atlas: []                         # data-protection risk, not an adversary technique

  - id: TH-04
    name: Secrets & Credentials Leakage
    category: Sensitive Data
    description: API keys, tokens, private keys or passwords leaked in prompt, output or tool results
    controls: [C-SECRET-IN, C-SECRET-OUT]
    owasp_llm: [LLM02:2025]           # Sensitive Information Disclosure
    owasp_agentic: [ASI03]            # Identity & Privilege Abuse
    atlas: [AML.T0057, AML.T0098]     # LLM Data Leakage; AI Agent Tool Credential Harvesting

  - id: TH-05
    name: Outbound PII Leakage
    category: Sensitive Data
    description: PII leaked in model output or tool response
    controls: [C-PII-OUT]
    owasp_llm: [LLM02:2025]           # Sensitive Information Disclosure
    owasp_agentic: []
    atlas: [AML.T0057]                # LLM Data Leakage

  - id: TH-06
    name: Disallowed Model Selection
    category: Access Control
    description: Calling models not permitted for the caller identity's role
    controls: [C-MODEL-ALLOW]
    owasp_llm: [LLM03:2025]           # Supply Chain (unvetted / unapproved models)
    owasp_agentic: []
    atlas: []

  - id: TH-07
    name: Unauthorized Tool Invocation / Excessive Agency
    category: Access Control
    description: Invoking tools not granted to the role or violating tool arguments schema
    controls: [C-TOOL-ACL]
    owasp_llm: [LLM06:2025]           # Excessive Agency
    owasp_agentic: [ASI02]            # Tool Misuse
    atlas: [AML.T0053]                # AI Agent Tool Invocation

  - id: TH-08
    name: Impersonation & Missing Authentication
    category: Access Control
    description: Missing/invalid API key or agent header mismatch
    controls: [C-AUTH]
    owasp_llm: []
    owasp_agentic: [ASI03]            # Identity & Privilege Abuse
    atlas: [AML.T0012, AML.T0073]     # Valid Accounts; Impersonation

  - id: TH-09
    name: Delegation & Privilege Escalation
    category: Access Control
    description: Excessive delegation depth or unauthorized capability widening
    controls: [C-DELEG]
    owasp_llm: [LLM06:2025]           # Excessive Agency
    owasp_agentic: [ASI03, ASI07]     # Identity & Privilege Abuse; Insecure Inter-Agent Communication
    atlas: []

  - id: TH-10
    name: Unauthorized Memory / RAG Access
    category: Access Control
    description: Accessing restricted memory or document namespaces
    controls: [C-MEM-ACL]
    owasp_llm: [LLM08:2025, LLM02:2025] # Vector and Embedding Weaknesses; Sensitive Information Disclosure
    owasp_agentic: [ASI03]            # Identity & Privilege Abuse
    atlas: [AML.T0085.000]            # Data from AI Services: RAG Databases

  - id: TH-11
    name: Token Overuse
    category: Denial of Service / Resources
    description: Exceeding allocated token quotas
    controls: [C-BUDGET]
    owasp_llm: [LLM10:2025]           # Unbounded Consumption
    owasp_agentic: []
    atlas: [AML.T0034, AML.T0029]     # Cost Harvesting; Denial of AI Service

  - id: TH-12
    name: Cost / Compute Overuse
    category: Denial of Service / Resources
    description: Exceeding compute seconds or dollar budget limits
    controls: [C-BUDGET]
    owasp_llm: [LLM10:2025]           # Unbounded Consumption
    owasp_agentic: []
    atlas: [AML.T0034, AML.T0029]     # Cost Harvesting; Denial of AI Service

  - id: TH-13
    name: Runaway Tool Loops
    category: Denial of Service / Resources
    description: Repeated identical tool calls or excessive calls in a session
    controls: [C-LOOP]
    owasp_llm: [LLM10:2025, LLM06:2025] # Unbounded Consumption; Excessive Agency
    owasp_agentic: [ASI08]            # Cascading Failures
    atlas: [AML.T0034.002]            # Cost Harvesting: Agentic Resource Consumption

  - id: TH-14
    name: Unsafe Deserialization
    category: Supply Chain & Code Execution
    description: Malicious pickle or model artifact containing dangerous opcodes
    controls: [C-ARTIFACT]
    owasp_llm: [LLM03:2025]           # Supply Chain
    owasp_agentic: [ASI04, ASI05]     # Agentic Supply Chain; Unexpected Code Execution
    atlas: [AML.T0011.000, AML.T0010.003] # User Execution: Unsafe AI Artifacts; AI Supply Chain Compromise: Model

  - id: TH-15
    name: Malicious Code Execution
    category: Code Execution
    description: Shell command chaining, eval/exec, reverse shells in output or tool arguments
    controls: [C-CODE-EXEC]
    owasp_llm: [LLM05:2025]           # Improper Output Handling
    owasp_agentic: [ASI05]            # Unexpected Code Execution
    atlas: [AML.T0050, AML.T0102]     # Command and Scripting Interpreter; Generate Malicious Commands

  - id: TH-16
    name: Supply Chain Compromise
    category: Supply Chain & Code Execution
    description: Malicious packages or model repos
    controls: [C-SUPPLY]
    owasp_llm: [LLM03:2025]           # Supply Chain
    owasp_agentic: [ASI04]            # Agentic Supply Chain
    atlas: [AML.T0010, AML.T0011.001, AML.T0058] # AI Supply Chain Compromise; Malicious Package; Publish Poisoned Models

  - id: TH-17
    name: Known Historical Attack Signature
    category: Threat Intelligence
    description: Input matching known attack patterns from security feed
    controls: [C-SIG]
    owasp_llm: [LLM01:2025, LLM03:2025] # signatures cover injection and supply-chain artifacts
    owasp_agentic: [ASI01, ASI04]
    atlas: [AML.T0051, AML.T0011.000] # LLM Prompt Injection; Unsafe AI Artifacts

  - id: TH-18
    name: Canary / System Prompt Leakage
    category: Sensitive Data
    description: System prompt canary token detected in output or tool call
    controls: [C-CANARY]
    owasp_llm: [LLM07:2025]           # System Prompt Leakage
    owasp_agentic: []
    atlas: [AML.T0056]                # Extract LLM System Prompt

  - id: TH-19
    name: Tainted Session Privileged Action
    category: Prompt Injection
    description: Tool call with elevated privileges requested after untrusted data entered session
    controls: [C-TAINT]
    owasp_llm: [LLM01:2025, LLM06:2025] # Prompt Injection; Excessive Agency
    owasp_agentic: [ASI01, ASI02]     # Agent Goal Hijack; Tool Misuse
    atlas: [AML.T0051.001, AML.T0086] # Indirect Prompt Injection; Exfiltration via AI Agent Tool Invocation

  - id: TH-20
    name: Oversized Input / DoS
    category: Denial of Service / Resources
    description: Excessive message count, oversized message characters or payload bytes
    controls: [C-SIZE]
    owasp_llm: [LLM10:2025]           # Unbounded Consumption
    owasp_agentic: []
    atlas: [AML.T0029]                # Denial of AI Service
