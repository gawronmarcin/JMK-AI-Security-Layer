# `docker compose up`                       -> gateway :8080 + mock LLM + mock tools + mock MCP server
# `docker compose run --rm tests`           -> pełny suite w kontenerze (§11.8)
# `docker compose --profile ollama up`      -> dodatkowo prawdziwy Ollama
# `docker compose --profile hybrid up`      -> + bramka hybrydowa :8081 (policies/hybrid.yaml: bge-m3,
#                                              ProtectAI, sędzia qwen2.5:1.5b); Ollama pobiera modele
#                                              przy pierwszym starcie (ollama-init, ~2,5 GB)
# `docker compose --profile bastion up`     -> dodatkowo klasyfikator Bastion (:8090, backend: remote)
#  Podpięcie obu: docs/SEMANTIC_SETUP.md
# `AICL_EXTRAS=test,protectai,redis docker compose build` -> obraz z ProtectAI (ONNX) i klientem Redis
# `AICL_STATE_URL_OVERRIDE=redis://redis:6379/0 docker compose --profile redis up`
#                                           -> wspólny stan (budżety, sesje, zgody HITL) w Redisie;
#                                              wymaga obrazu z extra `redis`
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    args: {EXTRAS: "${AICL_EXTRAS:-test,protectai}"}
  image: aicl:dev

services:
  mock-llm:
    <<: *app
    command: uvicorn tests.mocks.mock_llm:app --host 0.0.0.0 --port 9001
    ports: ["127.0.0.1:9001:9001"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9001/healthz')"], interval: 5s, retries: 10}

  mock-tools:
    <<: *app
    command: uvicorn tests.mocks.mock_tools:app --host 0.0.0.0 --port 9002
    ports: ["127.0.0.1:9002:9002"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9002/healthz')"], interval: 5s, retries: 10}

  mock-mcp:
    # MCP server (Streamable HTTP) behind the gateway's /mcp/docs (tests/mocks/mock_mcp.py)
    <<: *app
    command: uvicorn tests.mocks.mock_mcp:app --host 0.0.0.0 --port 9003
    ports: ["127.0.0.1:9003:9003"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9003/healthz')"], interval: 5s, retries: 10}

  gateway:
    <<: *app
    env_file: [.env.example]
    environment:
      AICL_UPSTREAM_MOCK_URL: http://mock-llm:9001/v1
      AICL_OLLAMA_URL: ${AICL_OLLAMA_URL_OVERRIDE:-http://mock-llm:9001}
      AICL_BASTION_URL: ${AICL_BASTION_URL_OVERRIDE:-http://bastion:8080}
      AICL_TOOL_DOCS_URL: http://mock-tools:9002/tools/search_docs
      AICL_TOOL_FETCH_URL: http://mock-tools:9002/tools/fetch_url
      AICL_TOOL_MAIL_URL: http://mock-tools:9002/tools/send_email
      AICL_TOOL_SHELL_URL: http://mock-tools:9002/tools/run_shell
      AICL_MCP_DOCS_URL: http://mock-mcp:9003/mcp
      AICL_STATE_URL: ${AICL_STATE_URL_OVERRIDE:-}   # empty = state in the process
      HF_TOKEN: ${HF_TOKEN:-}
      WATCHFILES_FORCE_POLLING: "true"      # hot reload przez bind mount (macOS/Windows, §2)
    volumes:
      - ./policies:/app/policies
      - ./feeds:/app/feeds
      - aicl-data:/app/data   # named volume: writable by the non-root user (a host bind mount is not)
      - hf-cache:/home/aicl/.cache/huggingface  # ProtectAI model downloaded once, kept between runs
    ports: ["127.0.0.1:8080:8080"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"], interval: 5s, retries: 20}
    depends_on:
      mock-llm: {condition: service_healthy}
      mock-tools: {condition: service_healthy}
      mock-mcp: {condition: service_healthy}

  tests:
    <<: *app
    profiles: [tests]
    command: pytest -q
    user: "0:0"   # one-shot test runner: writes reports/ to the host bind mount (the image user cannot)
    environment: {AICL_TEST_REQUIRE_GATEWAY: "1"}
    volumes: ["./reports:/app/reports"]

  bastion:
    # Bastion Prompt Protection microservice (AGPL-3.0, free English model): POST /protect
    image: ghcr.io/bastion-soft/bastion-prompt-protection:latest
    profiles: [bastion]
    ports: ["127.0.0.1:8090:8080"]                # 8080 is the gateway

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama, hybrid]
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  ollama-init:
    # one-shot: pulls the models into the shared volume (the ollama CLI takes the server from OLLAMA_HOST)
    image: ollama/ollama:latest
    profiles: [hybrid]
    environment: {OLLAMA_HOST: "ollama:11434"}
    depends_on:
      ollama: {condition: service_started}
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull qwen2.5:1.5b && ollama pull bge-m3"]

  gateway-hybrid:
    # same gateway, AI tiers on: embeddings + judge on the real Ollama, ProtectAI in process
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: {EXTRAS: "test,protectai"}
    image: aicl:hybrid
    profiles: [hybrid]
    env_file: [.env.example]
    environment:
      AICL_POLICY: policies/hybrid.yaml
      AICL_UPSTREAM_MOCK_URL: http://mock-llm:9001/v1
      AICL_OLLAMA_URL: http://ollama:11434
      AICL_TOOL_DOCS_URL: http://mock-tools:9002/tools/search_docs
      AICL_TOOL_FETCH_URL: http://mock-tools:9002/tools/fetch_url
      AICL_TOOL_MAIL_URL: http://mock-tools:9002/tools/send_email
      AICL_TOOL_SHELL_URL: http://mock-tools:9002/tools/run_shell
      AICL_MCP_DOCS_URL: http://mock-mcp:9003/mcp
      AICL_STATE_URL: ${AICL_STATE_URL_OVERRIDE:-}
      HF_TOKEN: ${HF_TOKEN:-}
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./policies:/app/policies
      - ./feeds:/app/feeds
      - aicl-data:/app/data   # named volume: writable by the non-root user (a host bind mount is not)
      - hf-cache:/home/aicl/.cache/huggingface  # ProtectAI model downloaded once, kept between runs
    ports: ["127.0.0.1:8081:8080"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"], interval: 5s, retries: 60}
    depends_on:
      mock-llm: {condition: service_healthy}
      mock-tools: {condition: service_healthy}
      mock-mcp: {condition: service_healthy}
      ollama-init: {condition: service_completed_successfully}

  redis:
    image: redis:7-alpine
    profiles: [redis]
    ports: ["127.0.0.1:6379:6379"]

volumes:
  ollama: {}
  hf-cache: {}
  aicl-data: {}   # audit log; export: GET /admin/export/audit.jsonl
