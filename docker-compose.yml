# `docker compose up`                       -> gateway :8080 + mock LLM + mock tools
# `docker compose run --rm tests`           -> pełny suite w kontenerze (§11.8)
# `docker compose --profile ollama up`      -> dodatkowo prawdziwy Ollama
# `docker compose --profile bastion up`     -> dodatkowo klasyfikator Bastion (:8090, backend: remote)
#  Podpięcie obu: docs/SEMANTIC_SETUP.md
# `AICL_EXTRAS=test,protectai,redis docker compose build` -> obraz z ProtectAI (ONNX) i klientem Redis
# `AICL_STATE_URL_OVERRIDE=redis://redis:6379/0 docker compose --profile redis up`
#                                           -> wspólny stan (budżety, sesje, zgody HITL) w Redisie;
#                                              wymaga obrazu z extra `redis`
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    args: {EXTRAS: "${AICL_EXTRAS:-test}"}
  image: aicl:dev

services:
  mock-llm:
    <<: *app
    command: uvicorn tests.mocks.mock_llm:app --host 0.0.0.0 --port 9001
    ports: ["9001:9001"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9001/healthz')"], interval: 5s, retries: 10}

  mock-tools:
    <<: *app
    command: uvicorn tests.mocks.mock_tools:app --host 0.0.0.0 --port 9002
    ports: ["9002:9002"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9002/healthz')"], interval: 5s, retries: 10}

  gateway:
    <<: *app
    env_file: [.env.example]
    environment:
      AICL_UPSTREAM_MOCK_URL: http://mock-llm:9001/v1
      AICL_OLLAMA_URL: ${AICL_OLLAMA_URL_OVERRIDE:-http://mock-llm:9001}
      AICL_BASTION_URL: ${AICL_BASTION_URL_OVERRIDE:-http://bastion:8080}
      AICL_TOOL_DOCS_URL: http://mock-tools:9002/tools/search_docs
      AICL_TOOL_FETCH_URL: http://mock-tools:9002/tools/fetch_url
      AICL_TOOL_MAIL_URL: http://mock-tools:9002/tools/send_email
      AICL_TOOL_SHELL_URL: http://mock-tools:9002/tools/run_shell
      AICL_STATE_URL: ${AICL_STATE_URL_OVERRIDE:-}   # empty = state in the process
      WATCHFILES_FORCE_POLLING: "true"      # hot reload przez bind mount (macOS/Windows, §2)
    volumes:
      - ./policies:/app/policies
      - ./feeds:/app/feeds
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface  # ProtectAI model downloaded once, kept between runs
    ports: ["8080:8080"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"], interval: 5s, retries: 20}
    depends_on:
      mock-llm: {condition: service_healthy}
      mock-tools: {condition: service_healthy}

  tests:
    <<: *app
    profiles: [tests]
    command: pytest -q
    environment: {AICL_TEST_REQUIRE_GATEWAY: "1"}
    volumes: ["./reports:/app/reports"]

  bastion:
    # Bastion Prompt Protection microservice (AGPL-3.0, free English model): POST /protect
    image: ghcr.io/bastion-soft/bastion-prompt-protection:latest
    profiles: [bastion]
    ports: ["8090:8080"]                # 8080 is the gateway

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  redis:
    image: redis:7-alpine
    profiles: [redis]
    ports: ["6379:6379"]

volumes:
  ollama: {}
  hf-cache: {}
